name: Build and Sign Production APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Sign APK Natively
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Securely decode the pure key you saved
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > sovereign-key.jks
          
          # Find the newest apksigner already installed on the GitHub runner
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | sort -r | head -n 1)
          
          # Sign the APK
          $APKSIGNER sign --ks sovereign-key.jks --ks-pass env:KEYSTORE_PASSWORD --out Sovereign-Video-Editor-Signed.apk android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Sovereign-Video-Editor-Signed-APK
          path: Sovereign-Video-Editor-Signed.apk
